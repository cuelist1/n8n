---
services:
  n8n:
    image: n8nio/n8n:latest
    platform: linux/arm64
    container_name: n8n-test-1
    restart: unless-stopped
    environment:
      # Base URL Configuration
      - N8N_HOST=n8n.210parklab.org
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.210parklab.org/
      - N8N_EDITOR_BASE_URL=https://n8n.210parklab.org
      
      # Timezone Configuration
      - GENERIC_TIMEZONE=America/New_York
      - TZ=America/New_York
      
      # Other Settings
      - N8N_METRICS=false
      - N8N_METRICS_INCLUDE_QUEUE_METRICS=false
      - N8N_LOG_LEVEL=warn
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=false
      - N8N_SECURE_COOKIE=false
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - data:/home/node/.n8n
    ports:
      - "5678:5678"
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`n8n.210parklab.org`)
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.tls.certresolver=le
      - traefik.http.services.n8n.loadbalancer.server.port=5678
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  data:
    driver: local
